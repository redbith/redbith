<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFC" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#0284C7;#059669;#7C3AED" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0284C7">
        <animate attributeName="stop-color" values="#0284C7;#059669;#7C3AED;#0284C7" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#059669">
        <animate attributeName="stop-color" values="#059669;#7C3AED;#0284C7;#059669" dur="9s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;family=Inter:wght@400;600;800&amp;display=swap');
    .mono { font-family: 'Fira Code', monospace; }
    .sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .floating { animation: float 6s ease-in-out infinite; }
    .cursor { animation: blink 0.9s infinite; }
  </style>

  <rect width="1180" height="610" rx="24" fill="url(#bgGrad)" stroke="rgba(15, 23, 42, 0.1)" stroke-width="2" />

  <circle cx="200" cy="180" r="160" fill="#7C3AED" opacity="0.08" filter="url(#glow)">
    <animate attributeName="r" values="140;180;140" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="980" cy="460" r="200" fill="#0284C7" opacity="0.08" filter="url(#glow)">
    <animate attributeName="r" values="180;220;180" dur="10s" repeatCount="indefinite" />
  </circle>

  <!-- LEFT PANEL -->
  <g transform="translate(32, 32)">
    <rect width="410" height="546" rx="18" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.1)" stroke-width="1.5" />
    <path d="M 25 0 L 140 0 L 160 16 L 385 16 L 410 0" fill="none" stroke="url(#accentGrad)" stroke-width="2" />

    <g transform="translate(40, 35)" class="floating">
      <rect x="0" y="0" width="330" height="220" rx="14" fill="url(#logoGrad)" opacity="0.08" filter="url(#glow)" />
      <rect x="0" y="0" width="330" height="220" rx="14" fill="none" stroke="url(#logoGrad)" stroke-width="1.5" opacity="0.3" />

      <g transform="translate(100, 25) scale(0.95)">
        <path d="M 15 10 C 15 10, 45 5, 80 10 C 110 15, 125 40, 115 70 C 105 95, 85 105, 60 110 C 85 125, 110 150, 125 180 C 110 180, 85 180, 75 180 C 60 150, 45 125, 35 115 L 35 180 C 25 180, 15 180, 15 180 Z M 35 35 L 35 90 C 55 90, 85 85, 85 62 C 85 40, 60 35, 35 35 Z" fill="url(#logoGrad)" filter="url(#softGlow)" />
        <path d="M 5 0 L 85 0 C 120 0, 135 30, 125 70 C 115 100, 90 115, 65 120 L 135 190 L 115 190 L 50 120 L 20 120 L 20 190 L 0 190 Z" fill="none" stroke="#0284C7" stroke-width="1" opacity="0.3" />
      </g>

      <text x="165" y="200" text-anchor="middle" class="mono" font-size="12" fill="#0284C7" font-weight="700" letter-spacing="3">REDBITH ROOT</text>
    </g>

    <g transform="translate(35, 290)" class="mono">
      <rect x="0" y="0" width="340" height="220" rx="12" fill="#F1F5F9" stroke="rgba(15, 23, 42, 0.1)" stroke-width="1" />
      <text x="18" y="30" fill="#0284C7" font-size="13" font-weight="700">redbith@azerbaijan</text>
      <line x1="18" y1="40" x2="322" y2="40" stroke="rgba(15, 23, 42, 0.1)" stroke-width="1" />
      <text x="18" y="65" fill="#475569" font-size="11">OS:<tspan fill="#0F172A"> RedBith Arch Linux</tspan></text>
      <text x="18" y="87" fill="#475569" font-size="11">Kernel:<tspan fill="#0F172A"> 6.12.8-arch1-1</tspan></text>
      <text x="18" y="109" fill="#475569" font-size="11">Role:<tspan fill="#0F172A"> DevSecOps &amp; Security</tspan></text>
      <text x="18" y="131" fill="#475569" font-size="11">Level:<tspan fill="#0F172A"> RHCSA Linux Master</tspan></text>
      <text x="18" y="153" fill="#475569" font-size="11">Shell:<tspan fill="#0F172A"> zsh 5.9 (x86_64)</tspan></text>
      <text x="18" y="175" fill="#475569" font-size="11">Status:<tspan fill="#059669"> ● Active Bug Hunting</tspan></text>
      <circle cx="25" cy="198" r="5" fill="#EF4444" />
      <circle cx="42" cy="198" r="5" fill="#F59E0B" />
      <circle cx="59" cy="198" r="5" fill="#10B981" />
      <circle cx="76" cy="198" r="5" fill="#0284C7" />
      <circle cx="93" cy="198" r="5" fill="#7C3AED" />
    </g>
  </g>

