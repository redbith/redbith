          <g transform="translate(157,0)"><rect width="42" height="26" rx="6" fill="rgba(241, 245, 249, 0.95)" stroke="rgba(2, 132, 199, 0.2)" stroke-width="1"/><text x="21" y="17" fill="#0F172A" font-size="11" text-anchor="middle">C</text></g>
          <g transform="translate(207,0)"><rect width="48" height="26" rx="6" fill="rgba(241, 245, 249, 0.95)" stroke="rgba(2, 132, 199, 0.2)" stroke-width="1"/><text x="24" y="17" fill="#0F172A" font-size="11" text-anchor="middle">Go</text></g>
          <g transform="translate(263,0)"><rect width="55" height="26" rx="6" fill="rgba(241, 245, 249, 0.95)" stroke="rgba(2, 132, 199, 0.2)" stroke-width="1"/><text x="27" y="17" fill="#0F172A" font-size="11" text-anchor="middle">Tor</text></g>
          <g transform="translate(326,0)"><rect width="75" height="26" rx="6" fill="rgba(241, 245, 249, 0.95)" stroke="rgba(2, 132, 199, 0.2)" stroke-width="1"/><text x="37" y="17" fill="#0F172A" font-size="11" text-anchor="middle">Docker</text></g>
          <g transform="translate(409,0)"><rect width="102" height="26" rx="6" fill="rgba(241, 245, 249, 0.95)" stroke="rgba(2, 132, 199, 0.2)" stroke-width="1"/><text x="51" y="17" fill="#0F172A" font-size="11" text-anchor="middle">Kubernetes</text></g>
        </g>

        <g transform="translate(0, 50)">
          <g transform="translate(0,0)"><rect width="118" height="26" rx="6" fill="rgba(241, 245, 249, 0.95)" stroke="#0284C7" stroke-width="1"/><text x="59" y="17" fill="#0284C7" font-size="11" font-weight="700" text-anchor="middle">RHCSA Linux</text></g>
          <g transform="translate(126,0)"><rect width="100" height="26" rx="6" fill="rgba(241, 245, 249, 0.95)" stroke="rgba(2, 132, 199, 0.2)" stroke-width="1"/><text x="50" y="17" fill="#0F172A" font-size="11" text-anchor="middle">Git / GitLab</text></g>
          <g transform="translate(234,0)"><rect width="68" height="26" rx="6" fill="rgba(241, 245, 249, 0.95)" stroke="rgba(2, 132, 199, 0.2)" stroke-width="1"/><text x="34" y="17" fill="#0F172A" font-size="11" text-anchor="middle">MySQL</text></g>
          <g transform="translate(310,0)"><rect width="68" height="26" rx="6" fill="rgba(241, 245, 249, 0.95)" stroke="rgba(2, 132, 199, 0.2)" stroke-width="1"/><text x="34" y="17" fill="#0F172A" font-size="11" text-anchor="middle">SQLite</text></g>
          <g transform="translate(386,0)"><rect width="72" height="26" rx="6" fill="rgba(241, 245, 249, 0.95)" stroke="rgba(2, 132, 199, 0.2)" stroke-width="1"/><text x="36" y="17" fill="#0F172A" font-size="11" text-anchor="middle">CMake</text></g>
