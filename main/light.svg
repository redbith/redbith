      <text x="0" y="32" fill="#0F172A" class="sans" font-size="28" font-weight="800">Hi, I'm <tspan fill="url(#accentGrad)">Namiq Baghirzada</tspan></text>
      
      <g transform="translate(0, 64)" class="mono">
